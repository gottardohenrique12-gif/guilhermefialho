<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Guilherme Fialho</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f5f4f1;
      --surface:    #ffffff;
      --surface-2:  #f0ede8;
      --border:     #ddd9d3;
      --border-2:   #c8c4be;
      --accent:     #8c7355;
      --accent-dim: rgba(140,115,85,0.08);
      --text:       #1a1916;
      --muted:      #8a8680;
      --danger:     #b84040;
      --success:    #3a7a58;
      --mono:       'DM Mono', monospace;
      --sans:       'DM Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* LOGIN */
    #tela-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3rem 2.5rem;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    .login-logo {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .login-sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* CAMPOS */
    .campo { margin-bottom: 1rem; }

    .campo label {
      display: block;
      font-size: 0.72rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .campo input,
    .campo select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      border-radius: 0;
      appearance: none;
    }

    .campo input:focus,
    .campo select:focus { border-color: var(--accent); }

    /* BOTÕES */
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn-primary:hover   { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 1rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.6rem 1.1rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .btn-add:hover { opacity: 0.85; }

    .btn-del {
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 0.3rem 0.7rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-del:hover { background: rgba(184,64,64,0.06); border-color: var(--danger); }

    .erro-login {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* PAINEL */
    #painel { display: none; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-logo {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .painel-body {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    /* TABS */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 0.75rem 1.5rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: -1px;
      transition: all 0.2s;
    }

    .tab-btn.ativo { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.ativo { display: block; }

    .section-title {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    /* UPLOAD */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 640px) { .upload-grid { grid-template-columns: 1fr; } }

    .drop-zone {
      border: 1.5px dashed var(--border-2);
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: var(--surface);
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 0.75rem;
      border: 1.5px solid var(--border-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drop-icon svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.5; }

    .drop-text {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .preview-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: none;
      margin-top: 1rem;
      border: 1px solid var(--border);
    }

    .form-section { display: flex; flex-direction: column; gap: 1rem; }

    /* MSGS */
    .msg {
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
      margin-top: 1rem;
      display: none;
      font-family: var(--mono);
    }

    .msg.sucesso { background: rgba(58,122,88,0.08); border: 1px solid var(--success); color: var(--success); }
    .msg.erro    { background: rgba(184,64,64,0.08); border: 1px solid var(--danger);  color: var(--danger);  }

    /* FOTOS */
    .filtro-barra { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }

    .filtro-barra select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      outline: none;
      appearance: none;
    }

    .fotos-lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1rem;
    }

    .foto-card {
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .foto-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .foto-card-info { padding: 0.75rem; }

    .foto-card-nome {
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .foto-card-meta {
      font-size: 0.7rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 0.6rem;
    }

    .btn-remover-foto {
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 0.3rem 0.75rem;
      font-size: 0.7rem;
      font-family: var(--mono);
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-remover-foto:hover { background: rgba(184,64,64,0.06); }

    .sem-fotos {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      padding: 3rem;
      grid-column: 1/-1;
      font-family: var(--mono);
    }

    .loading {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: var(--mono);
      text-align: center;
      padding: 2rem;
    }

    /* ESTRUTURA */
    .estrutura-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 640px) { .estrutura-grid { grid-template-columns: 1fr; } }

    .estrutura-col h3 {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    .novo-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .novo-form input {
      flex: 1;
      min-width: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .novo-form input:focus { border-color: var(--accent); }

    .lista-itens { display: flex; flex-direction: column; gap: 0.4rem; }

    .item-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
    }

    .item-nome { font-size: 0.85rem; }

    .item-id {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-left: 0.5rem;
    }

    .item-fixo {
      font-size: 0.65rem;
      color: var(--border-2);
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="tela-login">
  <div class="login-box">
    <div class="login-logo">GFS Fotografia</div>
    <h1 class="login-title">Painel de administração</h1>
    <p class="login-sub">Acesso restrito ao proprietário do site.</p>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="input-senha" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') fazerLogin()"/>
    </div>
    <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
    <div class="erro-login" id="erro-login">Senha incorreta.</div>
  </div>
</div>

<!-- PAINEL -->
<div id="painel">
  <div class="topbar">
    <span class="topbar-logo">GFS Admin</span>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>

  <div class="painel-body">
    <div class="tabs">
      <button class="tab-btn ativo" onclick="mudarTab('upload')">Adicionar foto</button>
      <button class="tab-btn"       onclick="mudarTab('fotos')">Gerenciar fotos</button>
      <button class="tab-btn"       onclick="mudarTab('estrutura')">Eventos e categorias</button>
    </div>

    <!-- UPLOAD -->
    <div class="tab-content ativo" id="tab-upload">
      <div class="section-title">Nova foto</div>
      <div class="upload-grid">
        <div>
          <div class="drop-zone" id="drop-zone"
               ondragover="dragOver(event)" ondragleave="dragLeave()" ondrop="drop(event)">
            <input type="file" id="input-foto" accept="image/*" onchange="selecionarArquivo(event)"/>
            <div class="drop-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="drop-text">Arraste a foto aqui<br/>ou clique para selecionar</div>
          </div>
          <img id="preview-img" class="preview-img" alt="Preview"/>
        </div>

        <div class="form-section">
          <div class="campo">
            <label>Nome da foto</label>
            <input type="text" id="input-nome" placeholder="Ex: Tucano-de-bico-verde"/>
          </div>
          <div class="campo">
            <label>Preco (R$)</label>
            <input type="number" id="input-preco" placeholder="25.00" step="0.01" min="0"/>
          </div>
          <div class="campo">
            <label>Tipo</label>
            <select id="input-tipo" onchange="atualizarCategorias()">
              <option value="artistica">Artistica</option>
              <option value="evento">Evento</option>
            </select>
          </div>
          <div class="campo" id="campo-categoria-art">
            <label>Categoria artistica</label>
            <select id="input-categoria-art"></select>
          </div>
          <div class="campo" id="campo-evento" style="display:none">
            <label>Evento</label>
            <select id="input-evento-sel"></select>
          </div>
          <button class="btn-primary" onclick="enviarFoto()">Adicionar ao catalogo</button>
          <div class="msg" id="msg-upload"></div>
        </div>
      </div>
    </div>

    <!-- FOTOS -->
    <div class="tab-content" id="tab-fotos">
      <div class="section-title">Fotos adicionadas pelo admin</div>
      <div class="filtro-barra">
        <select id="filtro-categoria" onchange="carregarFotos()">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="fotos-lista" id="fotos-lista">
        <div class="loading">Carregando...</div>
      </div>
    </div>

    <!-- ESTRUTURA -->
    <div class="tab-content" id="tab-estrutura">
      <div class="section-title">Eventos e categorias</div>
      <div class="estrutura-grid">

        <div class="estrutura-col">
          <h3>Eventos</h3>
          <div class="novo-form">
            <input type="text" id="novo-evento-nome" placeholder="Nome do evento"/>
            <button class="btn-add" onclick="criarEvento()">Criar</button>
          </div>
          <div class="msg" id="msg-ev"></div>
          <div class="lista-itens" id="lista-eventos"></div>
        </div>

        <div class="estrutura-col">
          <h3>Categorias artisticas</h3>
          <div class="novo-form">
            <input type="text" id="nova-cat-nome" placeholder="Nome da categoria"/>
            <button class="btn-add" onclick="criarCategoria()">Criar</button>
          </div>
          <div class="msg" id="msg-cat"></div>
          <div class="lista-itens" id="lista-categorias"></div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  let token = sessionStorage.getItem('admin_token');
  let arquivoSelecionado = null;
  let estrutura = { eventos: [], categorias: [] };

  // ── Login ──
  async function fazerLogin() {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha: document.getElementById('input-senha').value })
    });
    if (r.ok) {
      token = (await r.json()).token;
      sessionStorage.setItem('admin_token', token);
      mostrarPainel();
    } else {
      document.getElementById('erro-login').style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('admin_token');
    token = null;
    document.getElementById('painel').style.display = 'none';
    document.getElementById('tela-login').style.display = 'flex';
  }

  async function mostrarPainel() {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    await carregarEstrutura();
    carregarFotos();
  }

  // ── Tabs ──
  function mudarTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('ativo', ['upload','fotos','estrutura'][i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('ativo'));
    document.getElementById(`tab-${tab}`).classList.add('ativo');
    if (tab === 'fotos') carregarFotos();
    if (tab === 'estrutura') renderizarEstrutura();
  }

  // ── Estrutura ──
  async function carregarEstrutura() {
    const r = await fetch('/api/estrutura');
    estrutura = await r.json();
    preencherSelects();
    renderizarEstrutura();
    preencherFiltro();
  }

  function preencherSelects() {
    document.getElementById('input-categoria-art').innerHTML =
      estrutura.categorias.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    document.getElementById('input-evento-sel').innerHTML =
      estrutura.eventos.length
        ? estrutura.eventos.map(e => `<option value="${e.id}">${e.nome}</option>`).join('')
        : '<option value="">Nenhum evento criado ainda</option>';
  }

  function preencherFiltro() {
    document.getElementById('filtro-categoria').innerHTML =
      '<option value="">Todas</option>' +
      estrutura.categorias.map(c => `<option value="${c.id}">${c.nome}</option>`).join('') +
      estrutura.eventos.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
  }

  function renderizarEstrutura() {
    const FIXOS_CAT = ['paisagens','retratos','animais','luar','natureza','serra','arquitetura'];
    const FIXOS_EV  = ['meia-maratona','triatlon'];

    document.getElementById('lista-eventos').innerHTML =
      estrutura.eventos.map(e => `
        <div class="item-linha">
          <div>
            <span class="item-nome">${e.nome}</span>
            <span class="item-id">${e.id}</span>
          </div>
          ${FIXOS_EV.includes(e.id)
            ? '<span class="item-fixo">padrao</span>'
            : `<button class="btn-del" onclick="deletarEvento('${e.id}')">Remover</button>`}
        </div>`
      ).join('') || '<div class="loading">Nenhum evento.</div>';

    document.getElementById('lista-categorias').innerHTML =
      estrutura.categorias.map(c => `
        <div class="item-linha">
          <div>
            <span class="item-nome">${c.nome}</span>
            <span class="item-id">${c.id}</span>
          </div>
          ${FIXOS_CAT.includes(c.id)
            ? '<span class="item-fixo">padrao</span>'
            : `<button class="btn-del" onclick="deletarCategoria('${c.id}')">Remover</button>`}
        </div>`
      ).join('') || '<div class="loading">Nenhuma categoria.</div>';
  }

  async function criarEvento() {
    const nome = document.getElementById('novo-evento-nome').value.trim();
    if (!nome) return mostrarMsg('ev', 'Informe o nome do evento.', 'erro');
    const r = await fetch('/api/admin/eventos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify({ nome })
    });
    const d = await r.json();
    if (r.ok) {
      estrutura.eventos.push({ id: d.id, nome });
      document.getElementById('novo-evento-nome').value = '';
      preencherSelects(); preencherFiltro(); renderizarEstrutura();
      mostrarMsg('ev', 'Evento criado.', 'sucesso');
    } else { mostrarMsg('ev', d.erro || 'Erro.', 'erro'); }
  }

  async function deletarEvento(id) {
    if (!confirm('Remover este evento?')) return;
    await fetch(`/api/admin/eventos/${id}`, { method: 'DELETE', headers: { 'Authorization': token } });
    estrutura.eventos = estrutura.eventos.filter(e => e.id !== id);
    preencherSelects(); preencherFiltro(); renderizarEstrutura();
  }

  async function criarCategoria() {
    const nome = document.getElementById('nova-cat-nome').value.trim();
    if (!nome) return mostrarMsg('cat', 'Informe o nome da categoria.', 'erro');
    const r = await fetch('/api/admin/categorias', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify({ nome })
    });
    const d = await r.json();
    if (r.ok) {
      estrutura.categorias.push({ id: d.id, nome });
      document.getElementById('nova-cat-nome').value = '';
      preencherSelects(); preencherFiltro(); renderizarEstrutura();
      mostrarMsg('cat', 'Categoria criada.', 'sucesso');
    } else { mostrarMsg('cat', d.erro || 'Erro.', 'erro'); }
  }

  async function deletarCategoria(id) {
    if (!confirm('Remover esta categoria?')) return;
    await fetch(`/api/admin/categorias/${id}`, { method: 'DELETE', headers: { 'Authorization': token } });
    estrutura.categorias = estrutura.categorias.filter(c => c.id !== id);
    preencherSelects(); preencherFiltro(); renderizarEstrutura();
  }

  // ── Upload ──
  function dragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('dragover'); }
  function dragLeave()  { document.getElementById('drop-zone').classList.remove('dragover'); }
  function drop(e) { e.preventDefault(); dragLeave(); const f = e.dataTransfer.files[0]; if (f) processarArquivo(f); }
  function selecionarArquivo(e) { const f = e.target.files[0]; if (f) processarArquivo(f); }

  function processarArquivo(file) {
    arquivoSelecionado = file;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('preview-img');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
    if (!document.getElementById('input-nome').value) {
      const nome = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      document.getElementById('input-nome').value = nome.charAt(0).toUpperCase() + nome.slice(1);
    }
  }

  function atualizarCategorias() {
    const tipo = document.getElementById('input-tipo').value;
    document.getElementById('campo-categoria-art').style.display = tipo === 'artistica' ? 'block' : 'none';
    document.getElementById('campo-evento').style.display = tipo === 'evento' ? 'block' : 'none';
  }

  async function enviarFoto() {
    const nome  = document.getElementById('input-nome').value.trim();
    const preco = parseFloat(document.getElementById('input-preco').value);
    const tipo  = document.getElementById('input-tipo').value;
    const cat   = tipo === 'artistica'
      ? document.getElementById('input-categoria-art').value
      : document.getElementById('input-evento-sel').value;

    if (!arquivoSelecionado)  return mostrarMsg('upload', 'Selecione uma foto.', 'erro');
    if (!nome)                return mostrarMsg('upload', 'Informe o nome.', 'erro');
    if (!preco || preco <= 0) return mostrarMsg('upload', 'Informe um preco valido.', 'erro');

    const btn = document.querySelector('#tab-upload .btn-primary');
    btn.textContent = 'Enviando...'; btn.disabled = true;

    const form = new FormData();
    form.append('foto', arquivoSelecionado);
    form.append('nome', nome);
    form.append('preco', preco);
    form.append('tipo', tipo);
    form.append('categoria', cat);

    try {
      const r = await fetch('/api/admin/upload', {
        method: 'POST', headers: { 'Authorization': token }, body: form
      });
      const d = await r.json();
      if (r.ok) {
        mostrarMsg('upload', 'Foto adicionada com sucesso.', 'sucesso');
        arquivoSelecionado = null;
        document.getElementById('preview-img').style.display = 'none';
        document.getElementById('input-nome').value = '';
        document.getElementById('input-preco').value = '';
        document.getElementById('input-foto').value = '';
      } else { mostrarMsg('upload', d.erro || 'Erro ao enviar.', 'erro'); }
    } catch(e) { mostrarMsg('upload', 'Erro de conexao.', 'erro'); }
    finally { btn.textContent = 'Adicionar ao catalogo'; btn.disabled = false; }
  }

  function mostrarMsg(tab, texto, tipo) {
    const el = document.getElementById(`msg-${tab}`);
    el.textContent = texto; el.className = `msg ${tipo}`; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  // ── Listagem ──
  async function carregarFotos() {
    const lista = document.getElementById('fotos-lista');
    const filtro = document.getElementById('filtro-categoria').value;
    lista.innerHTML = '<div class="loading">Carregando...</div>';
    try {
      const r = await fetch('/api/admin/fotos?categoria=' + filtro, { headers: { 'Authorization': token } });
      const fotos = await r.json();
      if (!fotos.length) {
        lista.innerHTML = '<div class="sem-fotos">Nenhuma foto adicionada pelo admin ainda.</div>';
        return;
      }
      lista.innerHTML = fotos.map(f => `
        <div class="foto-card">
          <img src="${f.preview}" alt="${f.nome}" loading="lazy"/>
          <div class="foto-card-info">
            <div class="foto-card-nome">${f.nome}</div>
            <div class="foto-card-meta">R$ ${f.preco.toFixed(2).replace('.',',')} &middot; ${f.categoriaArtId || f.eventoId || ''}</div>
            <button class="btn-remover-foto" onclick="removerFoto('${f.id}')">Remover</button>
          </div>
        </div>`
      ).join('');
    } catch(e) { lista.innerHTML = '<div class="sem-fotos">Erro ao carregar.</div>'; }
  }

  async function removerFoto(id) {
    if (!confirm('Remover esta foto?')) return;
    const r = await fetch('/api/admin/fotos/' + id, { method: 'DELETE', headers: { 'Authorization': token } });
    if (r.ok) carregarFotos();
    else alert('Erro ao remover.');
  }

  // ── Init ──
  (async () => {
    if (token) {
      const r = await fetch('/api/admin/verificar', { headers: { 'Authorization': token } });
      if (r.ok) { mostrarPainel(); return; }
    }
  })();
</script>
</body>
</html>
