<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Guilherme Fialho</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #c9a84c;
      --accent-dim: rgba(201,168,76,0.15);
      --text: #e8e8e8;
      --muted: #666;
      --danger: #e05555;
      --success: #4caf7d;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #tela-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3rem 2.5rem;
    }

    .login-logo {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .login-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .campo {
      margin-bottom: 1rem;
    }

    .campo label {
      display: block;
      font-size: 0.75rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .campo input, .campo select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .campo input:focus, .campo select:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.85rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .erro-login {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* ── PAINEL ── */
    #painel { display: none; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-logo {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 1rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .painel-body {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 0.75rem 1.5rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: -1px;
      transition: all 0.2s;
    }

    .tab-btn.ativo {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.ativo { display: block; }

    /* ── UPLOAD ── */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 640px) { .upload-grid { grid-template-columns: 1fr; } }

    .drop-zone {
      border: 2px dashed var(--border);
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon { font-size: 2rem; margin-bottom: 0.75rem; }

    .drop-text {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .preview-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: none;
      margin-top: 1rem;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .section-title {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .msg {
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }

    .msg.sucesso { background: rgba(76,175,125,0.1); border: 1px solid var(--success); color: var(--success); }
    .msg.erro    { background: rgba(224,85,85,0.1);  border: 1px solid var(--danger);  color: var(--danger);  }

    /* ── LISTAGEM ── */
    .filtro-barra {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filtro-barra select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      outline: none;
    }

    .fotos-lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .foto-card {
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .foto-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .foto-card-info {
      padding: 0.75rem;
    }

    .foto-card-nome {
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .foto-card-meta {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 0.5rem;
    }

    .btn-remover-foto {
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 0.3rem 0.75rem;
      font-size: 0.72rem;
      font-family: var(--mono);
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-remover-foto:hover { background: rgba(224,85,85,0.1); }

    .sem-fotos {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 3rem;
      grid-column: 1/-1;
    }

    .loading {
      color: var(--muted);
      font-size: 0.85rem;
      font-family: var(--mono);
      text-align: center;
      padding: 2rem;
    }

    /* ── CATEGORIAS ── */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 640px) { .cat-grid { grid-template-columns: 1fr; } }

    .cat-bloco h3 {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    .cat-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .cat-form .linha {
      display: flex;
      gap: 0.5rem;
    }

    .cat-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.9rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .cat-form input:focus { border-color: var(--accent); }

    .cat-form input.icone { max-width: 64px; text-align: center; }

    .btn-add-cat {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .btn-add-cat:hover { opacity: 0.85; }

    .cat-lista {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
    }

    .cat-item-esq {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cat-item-icone { font-size: 1rem; }

    .cat-item-id {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 0.25rem;
    }

    .btn-del-cat {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .btn-del-cat:hover { opacity: 1; }

    .cat-vazio {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: var(--mono);
      padding: 1rem 0;
    }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login">
  <div class="login-box">
    <div class="login-logo">GFS Fotografia</div>
    <h1 class="login-title">Painel Admin</h1>
    <p class="login-sub">Acesso restrito ao proprietário do site.</p>

    <div class="campo">
      <label>Senha</label>
      <input type="password" id="input-senha" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') fazerLogin()"/>
    </div>

    <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
    <div class="erro-login" id="erro-login">Senha incorreta.</div>
  </div>
</div>

<!-- PAINEL -->
<div id="painel">
  <div class="topbar">
    <span class="topbar-logo">GFS Admin</span>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>

  <div class="painel-body">
    <div class="tabs">
      <button class="tab-btn ativo" onclick="mudarTab('upload')">Adicionar Foto</button>
      <button class="tab-btn" onclick="mudarTab('fotos')">Gerenciar Fotos</button>
      <button class="tab-btn" onclick="mudarTab('categorias')">Categorias</button>
    </div>

    <!-- TAB UPLOAD -->
    <div class="tab-content ativo" id="tab-upload">
      <div class="section-title">Nova Foto</div>
      <div class="upload-grid">
        <div>
          <div class="drop-zone" id="drop-zone"
               ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
            <input type="file" id="input-foto" accept="image/*" onchange="selecionarArquivo(event)"/>
            <div class="drop-icon">🖼️</div>
            <div class="drop-text">Arraste a foto aqui<br/>ou clique para selecionar</div>
          </div>
          <img id="preview-img" class="preview-img" alt="Preview"/>
        </div>

        <div class="form-section">
          <div class="campo">
            <label>Nome da Foto</label>
            <input type="text" id="input-nome" placeholder="Ex: Tucano-de-bico-verde"/>
          </div>

          <div class="campo">
            <label>Preço (R$)</label>
            <input type="number" id="input-preco" placeholder="25.00" step="0.01" min="0"/>
          </div>

          <div class="campo">
            <label>Tipo</label>
            <select id="input-tipo" onchange="atualizarCategorias()">
              <option value="artistica">Artística</option>
              <option value="evento">Evento</option>
            </select>
          </div>

          <div class="campo" id="campo-categoria-art">
            <label>Categoria Artística</label>
            <select id="input-categoria-art">
              <option value="paisagens">Paisagens</option>
              <option value="retratos">Retratos</option>
              <option value="animais">Animais</option>
              <option value="luar">Luar</option>
              <option value="natureza">Natureza</option>
              <option value="serra">Serra Gaúcha</option>
              <option value="arquitetura">Arquitetura</option>
            </select>
          </div>

          <div class="campo" id="campo-evento" style="display:none">
            <label>Evento</label>
            <input type="text" id="input-evento" placeholder="Ex: meia-maratona"/>
          </div>

          <button class="btn-primary" onclick="enviarFoto()">Adicionar ao Catálogo</button>
          <div class="msg" id="msg-upload"></div>
        </div>
      </div>
    </div>

    <!-- TAB FOTOS -->
    <div class="tab-content" id="tab-fotos">
      <div class="section-title">Fotos no Catálogo</div>
      <div class="filtro-barra">
        <select id="filtro-categoria" onchange="carregarFotos()">
          <option value="">Todas as categorias</option>
          <option value="paisagens">Paisagens</option>
          <option value="retratos">Retratos</option>
          <option value="animais">Animais</option>
          <option value="luar">Luar</option>
          <option value="natureza">Natureza</option>
          <option value="serra">Serra Gaúcha</option>
          <option value="arquitetura">Arquitetura</option>
          <option value="evento">Eventos</option>
        </select>
      </div>
      <div class="fotos-lista" id="fotos-lista">
        <div class="loading">Carregando...</div>
      </div>
    </div>

    <!-- TAB CATEGORIAS -->
    <div class="tab-content" id="tab-categorias">
      <div class="section-title">Eventos e Categorias</div>
      <div class="cat-grid">

        <!-- EVENTOS -->
        <div class="cat-bloco">
          <h3>Eventos</h3>
          <div class="cat-form">
            <div class="linha">
              <input type="text" id="ev-icone" class="icone" placeholder="🏅" maxlength="4"/>
              <input type="text" id="ev-nome" placeholder="Nome do evento (ex: Maratona 2025)"/>
            </div>
            <div class="linha">
              <input type="text" id="ev-id" placeholder="ID único (ex: maratona-2025)"/>
              <button class="btn-add-cat" onclick="criarEvento()">+ Criar</button>
            </div>
          </div>
          <div class="msg" id="msg-ev"></div>
          <div class="cat-lista" id="lista-eventos">
            <div class="cat-vazio">Carregando...</div>
          </div>
        </div>

        <!-- CATEGORIAS ARTÍSTICAS -->
        <div class="cat-bloco">
          <h3>Categorias Artísticas</h3>
          <div class="cat-form">
            <div class="linha">
              <input type="text" id="art-icone" class="icone" placeholder="🌿" maxlength="4"/>
              <input type="text" id="art-nome" placeholder="Nome da categoria (ex: Retratos)"/>
            </div>
            <div class="linha">
              <input type="text" id="art-id" placeholder="ID único (ex: retratos)"/>
              <button class="btn-add-cat" onclick="criarCategoriaArt()">+ Criar</button>
            </div>
          </div>
          <div class="msg" id="msg-art"></div>
          <div class="cat-lista" id="lista-artisticas">
            <div class="cat-vazio">Carregando...</div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  const SENHA_HASH = null; // validado no servidor
  let token = sessionStorage.getItem('admin_token');
  let arquivoSelecionado = null;

  // ── Login ──
  async function fazerLogin() {
    const senha = document.getElementById('input-senha').value;
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    if (r.ok) {
      const d = await r.json();
      token = d.token;
      sessionStorage.setItem('admin_token', token);
      mostrarPainel();
    } else {
      document.getElementById('erro-login').style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('admin_token');
    token = null;
    document.getElementById('painel').style.display = 'none';
    document.getElementById('tela-login').style.display = 'flex';
  }

  async function verificarToken() {
    if (!token) return false;
    const r = await fetch('/api/admin/verificar', {
      headers: { 'Authorization': token }
    });
    return r.ok;
  }

  // ── Tabs ──
  function mudarTab(tab) {
    const tabs = ['upload', 'fotos', 'categorias'];
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('ativo', tabs[i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('ativo'));
    document.getElementById(`tab-${tab}`).classList.add('ativo');
    if (tab === 'fotos') carregarFotos();
    if (tab === 'categorias') carregarCategorias();
  }

  // ── Upload ──
  function dragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('dragover'); }
  function dragLeave()  { document.getElementById('drop-zone').classList.remove('dragover'); }
  function drop(e) {
    e.preventDefault();
    dragLeave();
    const file = e.dataTransfer.files[0];
    if (file) processarArquivo(file);
  }

  function selecionarArquivo(e) {
    const file = e.target.files[0];
    if (file) processarArquivo(file);
  }

  function processarArquivo(file) {
    arquivoSelecionado = file;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('preview-img');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);

    // Auto-preenche nome com base no arquivo
    if (!document.getElementById('input-nome').value) {
      const nome = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      document.getElementById('input-nome').value =
        nome.charAt(0).toUpperCase() + nome.slice(1);
    }
  }

  function atualizarCategorias() {
    const tipo = document.getElementById('input-tipo').value;
    document.getElementById('campo-categoria-art').style.display = tipo === 'artistica' ? 'block' : 'none';
    document.getElementById('campo-evento').style.display = tipo === 'evento' ? 'block' : 'none';
  }

  async function enviarFoto() {
    const nome  = document.getElementById('input-nome').value.trim();
    const preco = parseFloat(document.getElementById('input-preco').value);
    const tipo  = document.getElementById('input-tipo').value;
    const catArt = document.getElementById('input-categoria-art').value;
    const evento = document.getElementById('input-evento').value.trim();

    if (!arquivoSelecionado) return mostrarMsg('upload', 'Selecione uma foto.', 'erro');
    if (!nome)               return mostrarMsg('upload', 'Informe o nome da foto.', 'erro');
    if (!preco || preco <= 0) return mostrarMsg('upload', 'Informe um preço válido.', 'erro');
    if (tipo === 'evento' && !evento) return mostrarMsg('upload', 'Informe o ID do evento.', 'erro');

    const btn = document.querySelector('#tab-upload .btn-primary');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    const form = new FormData();
    form.append('foto', arquivoSelecionado);
    form.append('nome', nome);
    form.append('preco', preco);
    form.append('tipo', tipo);
    form.append('categoria', tipo === 'artistica' ? catArt : evento);

    try {
      const r = await fetch('/api/admin/upload', {
        method: 'POST',
        headers: { 'Authorization': token },
        body: form
      });
      const d = await r.json();
      if (r.ok) {
        mostrarMsg('upload', '✅ Foto adicionada com sucesso!', 'sucesso');
        arquivoSelecionado = null;
        document.getElementById('preview-img').style.display = 'none';
        document.getElementById('input-nome').value = '';
        document.getElementById('input-preco').value = '';
        document.getElementById('input-foto').value = '';
      } else {
        mostrarMsg('upload', '❌ ' + (d.erro || 'Erro ao enviar.'), 'erro');
      }
    } catch(e) {
      mostrarMsg('upload', '❌ Erro de conexão.', 'erro');
    } finally {
      btn.textContent = 'Adicionar ao Catálogo';
      btn.disabled = false;
    }
  }

  function mostrarMsg(tab, texto, tipo) {
    const el = document.getElementById(`msg-${tab}`);
    el.textContent = texto;
    el.className = `msg ${tipo}`;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  // ── Listagem ──
  async function carregarFotos() {
    const lista = document.getElementById('fotos-lista');
    const filtro = document.getElementById('filtro-categoria').value;
    lista.innerHTML = '<div class="loading">Carregando...</div>';

    try {
      const r = await fetch('/api/admin/fotos?categoria=' + filtro, {
        headers: { 'Authorization': token }
      });
      const fotos = await r.json();

      if (!fotos.length) {
        lista.innerHTML = '<div class="sem-fotos">Nenhuma foto nesta categoria.</div>';
        return;
      }

      lista.innerHTML = fotos.map(f => `
        <div class="foto-card">
          <img src="${f.preview}" alt="${f.nome}" loading="lazy"/>
          <div class="foto-card-info">
            <div class="foto-card-nome">${f.nome}</div>
            <div class="foto-card-meta">R$ ${f.preco.toFixed(2).replace('.',',')} · ${f.categoriaArtId || f.eventoId || ''}</div>
            <button class="btn-remover-foto" onclick="removerFoto('${f.id}')">Remover</button>
          </div>
        </div>
      `).join('');
    } catch(e) {
      lista.innerHTML = '<div class="sem-fotos">Erro ao carregar fotos.</div>';
    }
  }

  async function removerFoto(id) {
    if (!confirm('Remover esta foto do catálogo?')) return;
    const r = await fetch('/api/admin/fotos/' + id, {
      method: 'DELETE',
      headers: { 'Authorization': token }
    });
    if (r.ok) carregarFotos();
    else alert('Erro ao remover foto.');
  }

  // ── Categorias ──
  const CATS_FIXAS_ART = [
    { id: 'paisagens', nome: 'Paisagens', icone: '' },
    { id: 'animais',   nome: 'Animais',   icone: '' },
    { id: 'luar',      nome: 'Luar',      icone: '' },
    { id: 'natureza',  nome: 'Natureza',  icone: '' },
    { id: 'serra',     nome: 'Serra Gaúcha', icone: '' },
    { id: 'arquitetura', nome: 'Arquitetura', icone: '' },
  ];
  const EVENTOS_FIXOS = [
    { id: 'meia-maratona', nome: 'Meia Maratona', icone: '' },
    { id: 'triatlon',      nome: 'Triátlon',       icone: '' },
  ];

  async function carregarCategorias() {
    try {
      const r = await fetch('/api/categorias');
      const { eventos, artisticas } = await r.json();
      renderizarListaCat('lista-eventos',    EVENTOS_FIXOS,    eventos,    'evento');
      renderizarListaCat('lista-artisticas', CATS_FIXAS_ART,   artisticas, 'art');
      atualizarSelectsCategorias(artisticas, eventos);
    } catch(e) {
      document.getElementById('lista-eventos').innerHTML = '<div class="cat-vazio">Erro ao carregar.</div>';
      document.getElementById('lista-artisticas').innerHTML = '<div class="cat-vazio">Erro ao carregar.</div>';
    }
  }

  function renderizarListaCat(containerId, fixas, dinamicas, tipo) {
    const el = document.getElementById(containerId);
    const todasFixas = fixas.map(c => `
      <div class="cat-item">
        <div class="cat-item-esq">
          <span class="cat-item-icone">${c.icone}</span>
          <span>${c.nome}</span>
          <span class="cat-item-id">${c.id}</span>
        </div>
        <span style="font-size:0.7rem;color:var(--muted);font-family:var(--mono)">fixo</span>
      </div>
    `).join('');

    const todasDin = dinamicas.map(c => `
      <div class="cat-item">
        <div class="cat-item-esq">
          <span class="cat-item-icone">${c.icone || ''}</span>
          <span>${c.nome}</span>
          <span class="cat-item-id">${c.id}</span>
        </div>
        <button class="btn-del-cat" onclick="deletarCategoria('${tipo}','${c.id}')">✕</button>
      </div>
    `).join('');

    el.innerHTML = todasFixas + (todasDin || '') ||
      '<div class="cat-vazio">Nenhuma categoria criada ainda.</div>';
  }

  function atualizarSelectsCategorias(artisticas, eventos) {
    // Select de categoria artística no upload
    const selArt = document.getElementById('input-categoria-art');
    const opcsFixas = CATS_FIXAS_ART.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    const opcsDin = artisticas.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    selArt.innerHTML = opcsFixas + opcsDin;

    // Select de filtro de fotos — adiciona eventos dinâmicos
    const filtro = document.getElementById('filtro-categoria');
    const base = `
      <option value="">Todas as categorias</option>
      ${CATS_FIXAS_ART.map(c => `<option value="${c.id}">${c.nome}</option>`).join('')}
      ${artisticas.map(c => `<option value="${c.id}">${c.nome}</option>`).join('')}
      <option value="evento">Eventos</option>
    `;
    filtro.innerHTML = base;
  }

  async function criarEvento() {
    const id    = document.getElementById('ev-id').value.trim().toLowerCase().replace(/\s+/g,'-');
    const nome  = document.getElementById('ev-nome').value.trim();
    const icone = document.getElementById('ev-icone').value.trim();
    if (!id || !nome) return mostrarMsg('ev', 'Preencha ID e nome.', 'erro');
    if (EVENTOS_FIXOS.some(e => e.id === id)) return mostrarMsg('ev', 'Esse ID já existe como evento fixo.', 'erro');

    const r = await fetch('/api/admin/eventos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify({ id, nome, icone })
    });
    if (r.ok) {
      mostrarMsg('ev', '✅ Evento criado!', 'sucesso');
      document.getElementById('ev-id').value = '';
      document.getElementById('ev-nome').value = '';
      document.getElementById('ev-icone').value = '';
      carregarCategorias();
    } else {
      const d = await r.json();
      mostrarMsg('ev', '❌ ' + (d.erro || 'Erro.'), 'erro');
    }
  }

  async function criarCategoriaArt() {
    const id    = document.getElementById('art-id').value.trim().toLowerCase().replace(/\s+/g,'-');
    const nome  = document.getElementById('art-nome').value.trim();
    const icone = document.getElementById('art-icone').value.trim();
    if (!id || !nome) return mostrarMsg('art', 'Preencha ID e nome.', 'erro');
    if (CATS_FIXAS_ART.some(c => c.id === id)) return mostrarMsg('art', 'Esse ID já existe como categoria fixa.', 'erro');

    const r = await fetch('/api/admin/artisticas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify({ id, nome, icone })
    });
    if (r.ok) {
      mostrarMsg('art', '✅ Categoria criada!', 'sucesso');
      document.getElementById('art-id').value = '';
      document.getElementById('art-nome').value = '';
      document.getElementById('art-icone').value = '';
      carregarCategorias();
    } else {
      const d = await r.json();
      mostrarMsg('art', '❌ ' + (d.erro || 'Erro.'), 'erro');
    }
  }

  async function deletarCategoria(tipo, id) {
    if (!confirm(`Remover esta ${tipo === 'evento' ? 'evento' : 'categoria'}? As fotos associadas a ela continuarão no catálogo.`)) return;
    const endpoint = tipo === 'evento' ? 'eventos' : 'artisticas';
    const r = await fetch(`/api/admin/${endpoint}/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': token }
    });
    if (r.ok) carregarCategorias();
    else alert('Erro ao remover.');
  }

  // ── Init ──
  async function mostrarPainel() {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    await carregarCategorias(); // carrega selects antes de tudo
    carregarFotos();
  }

  (async () => {
    if (token && await verificarToken()) {
      mostrarPainel();
    }
  })();
</script>
</body>
</html>
